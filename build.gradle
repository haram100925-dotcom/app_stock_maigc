buildscript {
    repositories {
        // jcenter() has been removed
        google()
        mavenCentral()
    }
    dependencies {
        // Update Android Gradle Plugin to 8.0.0
        classpath "com.android.tools.build:gradle:8.0.0"
        classpath "com.google.gms:google-services:4.4.1" // latest as of writing, check for newer
    }
}

// Use the plugins block for applying plugins in newer Gradle versions
plugins {
    id "com.android.application" version "8.0.0" apply false
    id "org.jetbrains.kotlin.android" version "1.8.10" apply false // Or your Kotlin version
    id "com.google.gms.google-services" version "4.4.1" apply false
}
ext {
    sourceCompatibility = JavaVersion.VERSION_17
}


task clean(type: Delete) {
    delete rootProject.buildDir
}
